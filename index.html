    <!--
      THEME SCRIPT — runs synchronously before first paint, no flash.
      This release intentionally starts new visitors in light mode.
      After that, localStorage saves the user's own choice per-browser.
    -->
    <script>
      (function () {
        var DEPLOY = '20260827';
        var stamp = localStorage.getItem('ndm-deploy');
        var saved = localStorage.getItem('ndm-theme');
        if (stamp !== DEPLOY) {
          // Reset the old release preference so this release opens in light mode.
          localStorage.removeItem('ndm-theme');
          localStorage.setItem('ndm-deploy', DEPLOY);
        }
        var useDark = stamp === DEPLOY && saved === 'dark';
        document.documentElement.classList.toggle('dark', useDark);
        document.documentElement.classList.toggle('light', !useDark);
      })();
    </script>
